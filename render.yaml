# ReplyPals — one-click deploy on Render (free tier friendly).
# https://render.com/docs/blueprint-spec
#
# After deploy:
#   1. Set env vars in Render dashboard (from api/.env.example).
#   2. Set APP_BASE_URL=https://YOUR-SERVICE.onrender.com
#   3. Set ALLOWED_ORIGINS=https://YOUR-SERVICE.onrender.com,chrome-extension://YOUR_EXT_ID
#   4. Stripe webhook: https://YOUR-SERVICE.onrender.com/api/stripe-webhook
#   5. Extension build: REPLYPAL_API_URL=https://YOUR-SERVICE.onrender.com/api ./scripts/build.sh

services:
  - type: web
    name: replypals
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ROOT_PATH
        value: /api
      - key: UVICORN_WORKERS
        value: "1"
      - key: CANONICAL_HOST_REDIRECT
        value: "0"
