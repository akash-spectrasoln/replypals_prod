# ReplyPals — one-click deploy on Render (free tier friendly).
# https://render.com/docs/blueprint-spec
#
# After deploy:
#   1. Set env vars in Render (see docs/11-custom-domain-replypals-in.md).
#   2. Add custom domain replypals.in in Render → Settings → Custom Domains.
#   3. APP_BASE_URL=https://replypals.in  PUBLIC_API_BASE_URL=https://replypals.in/api
#   4. CANONICAL_HOST_REDIRECT=1  (redirects *.onrender.com → replypals.in)
#   5. Stripe webhook: https://replypals.in/api/stripe-webhook

services:
  - type: web
    name: replypals
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ROOT_PATH
        value: /api
      - key: UVICORN_WORKERS
        value: "1"
      - key: CANONICAL_HOST_REDIRECT
        value: "1"
