# Full-stack mode (FULL_STACK=1): nginx on $PORT, uvicorn on 127.0.0.1:8000.
# __PORT__ is substituted in docker-entrypoint.sh.

server {
  listen __PORT__;
  server_name _;

  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }

  location = /admin {
    return 301 /admin/;
  }

  # API + extension paths (/api/rewrite → uvicorn /rewrite)
  location /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
  }

  # React admin + JSON under /admin (HashRouter avoids GET route clashes)
  location ^~ /admin/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Astro marketing static files; fall back to FastAPI for dashboard, signup, etc.
  location / {
    root /var/www/website;
    index index.html;
    try_files $uri $uri/ $uri.html @app;
  }

  location @app {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
    root /var/www/website;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri @app;
  }

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1000;
}
